{%load static%}
<style>
.head-flag{
    background-color:whitesmoke;
    text-align: center;
    color: black;
    height: 40;
    font-size: 18;
    font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; 
    padding: 0 0 5 20;
    margin: -8;
    box-shadow:
    #d6d6e7 0 0 0 1.5px inset,
    rgba(45, 35, 66, 0.4) 0 2px 4px,
    rgba(45, 35, 66, 0.3) 0 7px 13px -3px,
    #d6d6e7 0 -3px 0 inset;
    font-weight: bold;
}

.bg-text {
  background-color: rgb(0,0,0); /* Fallback color */
  background-color: rgba(0,0,0, 0.8); /* Black w/opacity/see-through */
  color: white;
  font-size: 18;
  /* font-weight: bolder; */
  border: 3px solid #f1f1f1;
  position: absolute;
  margin-top: 40;
  left: 20%;
  /* transform: translate(-50%, -50%); */
  /* z-index: 2; */
  width:60%;
  height:fit-content;
  padding: 20px;
  text-align: center;
  align-items: center;
}

button {
  --primary-color: #645bff;
  --secondary-color: #fff;
  --hover-color: #111;
  box-sizing: border-box;
  border: 0;
  border-radius: 20px;
  color: var(--secondary-color);
  padding: .6em 1.0em;
  background: var(--primary-color);
  transition: 0.2s background;
  align-items: center;
  gap: 0.6em;
  font-weight: bold;
}

button:hover {
  background-color: var(--hover-color);
}

body{
    background-image: url("{% static '/image/application_bg.jpg'%}");
    background-size:cover; /* Optional: Makes the image cover the entire screen */
    background-position: center; /* Optional: Centers the image */
    background-attachment: fixed; /* Optional: Keeps the background image fixed while scrolling */
    background-repeat:no-repeat;
    backdrop-filter: blur(1px);
    font-family:'Times New Roman', Times, serif;    
} 

.table-tag{
    border-color: white; 
    text-size-adjust: auto; 
    color:black; 
    margin-top: 25; 
    font-weight: bolder; 
    min-width: 30pc; 
    background: white;
}

</style>

<html>

            <form method="post">

                <tr>
